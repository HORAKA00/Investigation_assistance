document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

; font-family: Barlow\">{{ tab.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div onclick=\"{{ openExport }}\" style=\"border: 1px solid #054BC5; color: #054BC5; font-weight: 400; font-size: 14px; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-bottom: 10px; font-family: Barlow\">Export<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- CASE NARRATIVE -->\n      <sc-if value=\"{{ isNarrative }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"padding-top:16px;\">\n          <div style=\"color: #000000; margin-bottom: 14px; line-height: 1.5; font-family: Barlow\">Case narrative is the reporter's original report, rebuilt as a readable narrative and tied together with the key facts extracted from the case documents, incident chronology and outcome.<br>You can regenerate or edit it.<\u002Fdiv>\n          <div style=\"background: #EDF1FA; border: 1px solid #054BC5; border-radius: 12px; padding: 16px; font-family: Barlow\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;\">\n              <div style=\"display: flex; align-items: center; gap: 10px; font-weight: 500; font-family: Barlow\">\n                <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#054BC5\" stroke-width=\"2\" style=\"stroke: #0B0B0B; stroke-width: 1.5px\"><path d=\"M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z\"><\u002Fpath><path d=\"M19 15l.8 1.9L21.7 17l-1.9.8L19 19.7l-.8-1.9L16.3 17l1.9-.8z\"><\u002Fpath><\u002Fsvg>\n                Case narrative\n                <span onclick=\"{{ regenNarrative }}\" style=\"display: flex; align-items: center; gap: 5px; color: #154DBC; font-weight: 400; cursor: pointer; margin-left: 6px; opacity: {{ narrativeRegenOpacity }}\">\n                  <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#054BC5\" stroke-width=\"2\" style=\"stroke: #1F60C3\"><path d=\"M21 12a9 9 0 lign-items:center;gap:8px;color:#0F766E;font-size:14px;\">\n                  <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0F766E\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>\n                  Re-generating narrative...\n                <\u002Fdiv>\n                <div style=\"width:18px;height:18px;border-radius:50%;border:2px solid #CDD2DF;border-top-color:#054BC5;animation:om-spin 0.8s linear infinite;\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ notNarrativeRegenerating }}\" hint-placeholder-val=\"{{ true }}\">\n              <sc-if value=\"{{ narrativeEditing }}\" hint-placeholder-val=\"{{ false }}\">\n                <textarea value=\"{{ narrativeDraft }}\" onchange=\"{{ setNarrativeDraft }}\" style=\"width:100%;box-sizing:border-box;min-height:160px;border:1px solid #CDD2DF;border-radius:8px;padding:10px 12px;font-family:Barlow;font-size:14px;line-height:1.6;color:#08090B;background:#fff;resize:vertical;\" style-focus=\"border-color:#054BC5;box-shadow:0 0 0 2px rgba(5,75,197,0.15);outline:none;\"><\u002Ftextarea>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notNarrativeEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"line-height: 1.6; color: #08090B; font-family: Barlow\">{{ narrativeText }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <div style=\"display: flex; align-items: center; gap: 6px; color: #6D7280; font-size: 12px; margin-top: 12px; font-family: Barlow\">\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6D7280\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>Content is AI-generated. Please review for accuracy.\n            <\u002Fdiv>\n          <\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- CASE FINDINGS -->\n      <sc-if value=\"{{ isFindings }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding-top: 16px; position: relative\">\n\n      <sc-if value=\"{{ isSelect }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:#fff;border:1px solid #EDF1FA;border-radius:10px;margin-top:20px;\">\n          <div style=\"padding:16px 20px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; font-family: Barlow\">\n              Case documentation\n            <\u002Fdiv>\n            <div style=\"color:#08090B;line-height:1.55;margin-top:10px;\"><p dir=\"ltr\" style=\"font-family: Barlow;margin:0;\">Case Documentation uses AI to analyze case details (auto-selected), attachments, case notes, and follow-ups you select below. It extracts observations on - what, when, who, and where - and generates a narrative from them, helping investigators review documents faster instead of manually going through artifacts across multiple sections.<\u002Fp><p dir=\"ltr\" style=\"font-family: Barlow;margin:10px 0 0 0;\">To begin, select the relevant artifacts below and choose Synthesize Case Documentation.<\u002Fp><p dir=\"ltr\" style=\"font-family: Barlow;margin:10px 0 0 0;\">This process typically takes 5-10 minutes.<\u002Fp><\u002Fdiv>\n            \n            <sc-if value=\"{{ isRescanMode }}\" hint-placeholder-val=\"{{ false }}\">\n              \n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #EDF1FA;\">\n            <div onclick=\"{{ toggleAttachmentsSection }}\" style=\"display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; cursor: pointer; font-family: Barlow\">\n              <div style=\"font-weight:600;\">Attachments<\u002Fdiv>\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6D7280\" stroke-width=\"2\" style=\"transform:{{ attachmentsChevron }};\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isAttachmentsOpen }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"padding:0 20px 20px 20px;\">\n                <div style=\"display: flex; align-items: flex-start; gap: 8px; background: #EDF1FA; border: 1px solid #054BC5; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font-size: 12px; color: #08090B; font-family: Barlow\">\n                  <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#054BC5\" stroke-width=\"2\" style=\"flex-shrink:0;margin-top:1px;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>\n                  <div style=\"font-size: 14px\">Case Documentation AI currently supports the following attachment types: PDF, MSG, DOCX, PNG, JPG, JPEG, XLSX, EML, MP4, DOC, PPTX, MOV, MP3, CSV, XLS, TXT, WAV, M4A.<br>File types that are not supported are not shown in the table below.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #EDF1FA;border-radius:8px;overflow:hidden;\">\n                  <div style=\"display:grid;grid-template-columns:28px 1.7fr 1fr 1.6fr 1.9fr;gap:10px;padding:10px 14px;background:#F7F9FC;font-size:12px;font-weight:600;color:#6D7280;border-bottom:1px solid #EDF1FA;align-items:center;\">\n                    <div onclick=\"{{ toggleAllAttachments }}\" style=\"width:15px;height:15px;border:1.5px solid {{ attAllBorder }};border-radius:3px;background:{{ attAllBg }};display:flex;align-items:center;justify-content:center;cursor:pointer;\">\n                      <sc-if value=\"{{ attAllChecked }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-family: Barlow\">File<\u002Fdiv><div style=\"font-family: Barlow\">Date<\u002Fdiv><div style=\"font-family: Barlow\">Description<\u002Fdiv>\n                    <div style=\"display: flex; align-items: center; gap: 5px; font-family: Barlow\">Attachment summary<svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6D7280\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ attachments }}\" as=\"att\" hint-placeholder-count=\"8\">\n                    <div style=\"display:grid;grid-template-columns:28px 1.7fr 1fr 1.6fr 1.9fr;gap:10px;padding:12px 14px;border-bottom:1px solid #F1F2F4;font-size:13px;align-items:start;\">\n                      <div onclick=\"{{ att.toggle }}\" style=\"width:15px;height:15px;border:1.5px solid {{ att.borderColor }};border-radius:3px;background:{{ att.bg }};display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;\">\n                        <sc-if value=\"{{ att.checked }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:6px;\">\n                        <div style=\"color: #054BC5; font-weight: 500; font-family: Barlow\">{{ att.file }}<\u002Fdiv>\n                        <sc-if value=\"{{ att.isNewlyFound }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px;font-weight:700;color:#1E616A;background:#ABF3FE;padding:1px 5px;border-radius:4px;\">New<\u002Fspan><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"color: #6D7280; font-family: Barlow\">{{ att.date }}<\u002Fdiv>\n                      <div style=\"color: #08090B; font-family: Barlow\">{{ att.desc }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:flex-start;gap:6px;color:#08090B;\">\n                        <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#054BC5\" stroke-width=\"2\" style=\"flex-shrink:0;margin-top:2px;\"><path d=\"M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8z\"><\u002Fpath><\u002Fsvg>\n                        <div style=\"font-family: Barlow\">{{ att.summary }}<sc-if value=\"{{ att.isNew }}\" hint-placeholder-val=\"{{ false }}\"><\u002Fsc-if><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:#6D7280;\">\n                  <div style=\"font-family: Barlow\">{{ attachmentsSelectedLabel }}<\u002Fdiv>\n                  <div style=\"font-family: Barlow\">Page 1 of 1 ({{ attachmentsTotal }} items)<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #EDF1FA;\">\n            <div onclick=\"{{ toggleCaseNotesSection }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;\">\n              <div style=\"font-weight: 600; font-family: Barlow\">Case notes<\u002Fdiv>\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6D7280\" stroke-width=\"2\" style=\"transform:{{ caseNotesChevron }};\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isCaseNotesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 20px 20px 20px;\">\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-family: Barlow\">\n                  <div onclick=\"{{ deselectAllCaseNotes }}\" style=\"{{ caseNotesDeselectAllStyle }}\">Deselect all<\u002Fdiv>\n                  <div onclick=\"{{ selectAllCaseNotes }}\" style=\"{{ caseNotesSelectAllStyle }}\">Select all<\u002Fdiv>\n                  <div style=\"color:#6D7280;font-size:12px;\">{{ caseNotesSelectedLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid #EDF1FA;border-radius:8px;max-height:280px;overflow:auto;\">\n                  <sc-for list=\"{{ caseNotes }}\" as=\"n\" hint-placeholder-count=\"5\">\n                    <div style=\"display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #F1F2F4;\">\n                      <div onclick=\"{{ n.toggle }}\" style=\"width:15px;height:15px;border:1.5px solid {{ n.borderColor }};border-radius:3px;background:{{ n.bg }};display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;flex-shrink:0;\">\n                        <sc-if value=\"{{ n.checked }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"font-size:13px;\">\n                        <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:3px;\">\n                          <div style=\"color: #6D7280; font-size: 12px; font-family: Barlow\">{{ n.dateAuthor }}<\u002Fdiv>\n                          <sc-if value=\"{{ n.isNewlyFound }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px;font-weight:700;color:#1E616A;background:#ABF3FE;padding:1px 5px;border-radius:4px;\">New<\u002Fspan><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"color: #08090B; line-height: 1.5; font-family: Barlow\">{{ n.body }}<sc-if value=\"{{ n.expanded }}\" hint-placeholder-val=\"{{ false }}\"> {{ n.more }}<\u002Fsc-if> <span onclick=\"{{ n.toggleExpand }}\" style=\"color:#054BC5;font-weight:600;cursor:pointer;\">{{ n.seeLabel }}<\u002Fspan><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"border-top:1px solid #EDF1FA;\">\n            <div onclick=\"{{ toggleFollowupsSection }}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;\">\n              <div style=\"font-weight: 600; font-family: Barlow\">Follow-ups<\u002Fdiv>\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6D7280\" stroke-width=\"2\" style=\"transform:{{ followupsChevron }};\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isFollowupsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:0 20px 20px 20px;\">\n                <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-family: Barlow\">\n                  <div onclick=\"{{ deselectAllFollowups }}\" style=\"{{ followupsDeselectAllStyle }}\">Deselect all<\u002Fdiv>\n                  <div onclick=\"{{ selectAllFollowups }}\" style=\"{{ followupsSelectAllStyle }}\">Select all<\u002Fdiv>\n                  <div style=\"color:#6D7280;font-size:12px;\">{{ followupsSelectedLabel }}<\u002Fdiv>\n                <\u002Fdiv><div style=\"border:1px solid #EDF1FA;border-radius:8px;max-height:360px;overflow:auto;padding:14px;\">\n                  <sc-for list=\"{{ followups }}\" as=\"fu\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:10px;margin-bottom:18px;\">\n                      <div onclick=\"{{ fu.toggle }}\" style=\"width:15px;height:15px;border:1.5px solid {{ fu.borderColor }};border-radius:3px;background:{{ fu.bg }};display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px;flex-shrink:0;\">\n                        <sc-if value=\"{{ fu.checked }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"10\" height=\"10\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><path d=\"M5 13l4 4L19 7\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"flex: 1; font-family: Barlow\">\n                        <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:4px;\">\n                          <div style=\"color:#6D7280;font-size:11px;\">{{ fu.dateQ }} - Investigator<\u002Fdiv>\n                          <sc-if value=\"{{ fu.isNewlyFound }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:9px;font-weight:700;color:#1E616A;background:#ABF3FE;padding:1px 5px;border-radius:4px;\">New<\u002Fspan><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"background:#054BC5;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:13px;\">\n                          <div style=\"font-weight:600;margin-bottom:2px;\">Question:<\u002Fdiv>\n                          <div>{{ fu.question }}<\u002Fdiv>\n                          <sc-if value=\"{{ fu.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"font-weight:600;margin-top:6px;\">Translation:<\u002Fdiv>\n                            <div>{{ fu.question }}<\u002Fdiv>\n                          <\u002Fsc-if>\n                          <div onclick=\"{{ fu.toggleExpand }}\" style=\"text-align:right;color:#E6ECF9;font-weight:600;font-size:11px;margin-top:4px;cursor:pointer;\">{{ fu.seeLabel }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"text-align:center;color:#6D7280;font-size:11px;margin:6px 0;\">Reporter answer<\u002Fdiv>\n                        <div style=\"color:#6D7280;font-size:11px;margin-bottom:4px;\">{{ fu.dateA }} - Reporter<\u002Fdiv>\n                        <div style=\"background:#F7F9FC;border:1px solid #EDF1FA;border-radius:10px;padding:10px 12px;font-size:13px;color:#08090B;\">\n                          <div style=\"font-weight:600;margin-bottom:2px;\">Comment:<\u002Fdiv>\n                          <div>{{ fu.answer }}<\u002Fdiv>\n                          <sc-if value=\"{{ fu.expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"font-weight:600;margin-top:6px;\">Translation:<\u002Fdiv>\n                            <div>{{ fu.answer }}<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                \n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:16px 20px;border-top:1px solid #EDF1FA;\">\n            <sc-if value=\"{{ isRescanMode }}\" hint-placeholder-val=\"{{ false }}\">\n              <div onclick=\"{{ cancelRescan }}\" style=\"border: 1px solid #CDD2DF; color: #08090B; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-family: Barlow\">Cancel<\u002Fdiv>\n            <\u002Fsc-if>\n            <div onclick=\"{{ startSynthesis }}\" style=\"background: #054BC5; color: #fff; font-weight: 400; font-size: 14px; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-family: Barlow\">{{ synthesizeButtonLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSynthesizing }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #EDF1FA;border-radius:10px;margin-top:20px;padding:16px 20px;\">\n          <div style=\"display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; font-family: Barlow\">\n            Case documentation\n          <\u002Fdiv>\n          <div style=\"max-width:520px;margin:60px auto;text-align:center;\">\n            <div style=\"height:8px;background:#EDF1FA;border-radius:4px;overflow:hidden;margin-bottom:16px;\">\n              <div style=\"height:100%;background:#054BC5;border-radius:4px;width:{{ progressWidth }};transition:width 0.4s;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-weight: 600; color: #08090B; margin-bottom: 6px; font-family: Barlow\">Synthesizing case documentation and generating case narrative...<\u002Fdiv>\n            <div style=\"color: #6D7280; font-size: 13px; font-family: Barlow\">This typically takes up to 10 minutes. You can leave this page and check back later.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReady }}\" hint-placeholder-val=\"{{ false }}\">          <div style=\"color: #000000; margin-bottom: 12px\"><p data-pm-slice=\"0 0 []\" style=\"font-family: Barlow;margin:0;\">Case Documentation AI has analyzed case details, attachments, case notes, and follow-ups, and synthesized the observations below. Each observation includes extractions from the selected artifacts - such as who, what, when, and where - along with the source of the data. A narrative is generated from these observations to help you review the documents faster.<\u002Fp><p style=\"font-family: Barlow;margin:10px 0 0 0;\">You can delete observations, scan for more documentation, or regenerate the observations or narrative.<\u002Fp><\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px; background: #EDFAFB; border: 1px solid #9FDCE3; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; font-size: 14px; color: #08090B; font-family: Barlow\">\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0B7285\" stroke-width=\"2\" style=\"flex-shrink:0;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>\n            Deleting or editing here does not change the details in the case.\n          <\u002Fdiv>\n          \n\n          <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;\">\n            <div style=\"color:#6D7280;font-size:13px;display:flex;flex-direction:column;gap:2px;\">\n              <sc-if value=\"{{ findingsScanning }}\" hint-placeholder-val=\"{{ false }}\">Scanning\\u2026<\u002Fsc-if>\n              <sc-if value=\"{{ notScanning }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-family: Barlow\">{{ findingsGeneratedLabel }}<\u002Fdiv>\n                <div style=\"font-family: Barlow\">Generated from <span onclick=\"{{ openSourcesModal }}\" style=\"color: #054BC5; text-decoration: underline; cursor: pointer; font-family: Barlow\">{{ sourcesCountLabel }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div onclick=\"{{ scanFindings }}\" style=\"border: 1px solid #054BC5; color: #054BC5; font-weight: 400; font-size: 14px; padding: 7px 14px; border-radius: 6px; cursor: pointer; position: static; font-family: Barlow\">Scan for more documents<\u002Fdiv>\n            <div sc-camel-on-mouse-enter=\"{{ showScanTip }}\" sc-camel-on-mouse-leave=\"{{ hideScanTip }}\" style=\"position:relative;display:flex;align-items:center;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6D7280\" stroke-width=\"2\" style=\"stroke: #194CDC;cursor:help;\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 16v-4M12 8h.01\"><\u002Fpath><\u002Fsvg>\n              <sc-if value=\"{{ scanTipOpen }}\" hint-placeholder-val=\"{{ false work email at 11:58 PM on 04/28/2026, complimenting her performance and offering preferential shift access if she came in early Thursday. In the intake follow-up the reporter confirmed two incident dates — a scheduling comment on 05/22/2026 and a shift-swap conversation on approximately 07/03/2026 — and stated that other day-shift employees had described similar experiences with Webb.\\nWitness Karen Ramos stated she had seen Webb make appearance-related comments to the reporter on at least two occasions — a late-March remark and a May conversation she described as flirtatious — and named two additional employees, Destiny Okafor and Priya Mehta. Both were approached by HR and declined to participate. Webb's HR employment record (Exhibit B) shows one prior complaint from 2023, marked resolved informally with no formal investigation, which Webb did not disclose during his interview. In his interview Webb denied harassing conduct, acknowledged sending Exhibit A while describing it as \\\"a work thing,\\\" and stated he did not know Okafor and Mehta; HR records place both on his shifts.\";\nconst ALT_FINDINGS_NARRATIVE_TEXT = \"The report names shift supervisor Marcus Webb. Karen Ramos, a witness, stated she had seen Webb make appearance-related comments to the reporter on at least two occasions — a late-March remark and a May conversation she described as flirtatious — and named two additional employees, Destiny Okafor and Priya Mehta, who were approached by HR and declined to participate. Exhibit A is a personal email Webb sent from his work address to the reporter's non-work email at 11:58 PM on 04/28/2026, offering preferential shift access if she came in early Thursday.\\nIn the intake follow-up the reporter confirmed two incident dates — a scheduling comment on 05/22/2026 and a shift-swap conversation on approximately 07/03/2026. Webb's HR employment record (Exhibit B) shows a 2023 complaint marked resolved informally, which Webb did not disclose. In his interview Webb denied harassing conduct, acknowledged sending Exhibit A, and stated he did not know Okafor and Mehta; HR records place both on his shifts.\";\n\nconst REPORT_SECTIONS = [\n  {key:'summary', label:'Case summary', hint:'Case number, type, location, dates, outcome'},\n  {key:'observations', label:'Case observations', hint:'AI-generated observations with sources'},\n  {key:'timeline', label:'Investigation timeline', hint:'Dated sequence of investigative events'},\n  {key:'outcome', label:'Case outcome', hint:'Substantiation, root cause, actions taken'},\n  {key:'narrative', label:'Case narrative', hint:'Full written account of the investigation'}\n];\n\nconst ORIGINAL_OUTCOME_TEXT = \"In the investigator's assessment, the evidence substantiates that Marcus Webb engaged in a pattern of conduct constituting harassment in violation of the Workplace Harassment Policy (v4.2). This judgment rests on personal contact through non-work channels at inappropriate hours (Exhibit A); two documented instances of leveraging scheduling authority alongside personal comments (05/22 and 07/03); a shift-assignment change on 07/03 that the investigator finds constitutes potential retaliation, corroborated by shift logs (Exhibit C); and a 2023 informal complaint Webb did not disclose. Weighing the corroborated evidence against Webb's account, the investigator assessed his credibility as low-to-moderate and his denial as not persuasive. Actions taken: a formal written warning retained in Webb's personnel file, mandatory harassment training to be completed within 30 days, and a 90-day HR check-in; the reporter and Karen Ramos were notified of the outcome and of retaliation protections. In the investigator's judgment, the root cause reflects inadequate supervisor-level training on boundaries and power dynamics, compounded by the 2023 complaint being resolved without a formal record.\";\nconst ALT_OUTCOME_TEXT = \"This investigation concluded that Marcus Webb harassed an anonymous overnight-shift employee in violation of Workplace Harassment Policy v4.2, and that a July 3 repack-line reassignment following her refusal to “get along” constitutes potential retaliation corroborated by shift logs. The evidence — a midnight personal email (Exhibit A), Karen Ramos's corroboration, the shift logs (Exhibit C), and an undisclosed 2023 complaint — outweighed Webb's low-to-moderate-credibility denial. In response, Webb received a formal written warning in his personnel file, was assigned mandatory harassment training due within 30 days, and will complete a 90-day HR check-in, while the reporter and Karen Ramos were informed of the outcome and their retaliation protections. At root, the conduct reflects a gap in supervisor training on boundaries and power dynamics, made worse by the fact that a 2023 informal complaint was closed without any formal investigation record.\";\n\nconst ACTIVITY_SEED = [\n  {id:1, date:'09/15/2026 09:00 AM', title:'Case closed — Substantiated', actor:'Curtis Jamison'},\n  {id:2, date:'09/13/2026 14:00 PM', title:'Outcome aligned with HR', actor:'Curtis Jamison'},\n  {id:3, date:'09/09/2026 09:00 AM', title:'Shift logs obtained (Exhibit C)', actor:'Curtis Jamison'},\n  {id:4, date:'09/08/2026 10:00 AM', title:'Reporter follow-up interview', actor:'Curtis Jamison'},\n  {id:5, date:'09/07/2026 13:30 PM', title:'Subject interview conducted', actor:'Curtis Jamison'},\n  {id:6, date:'09/05/2026 14:30 PM', title:'Witness interview recorded', actor:'Curtis Jamison'},\n  {id:7, date:'09/04/2026 15:00 PM', title:'HR record received (Exhibit B)', actor:'Sarah Chen'},\n  {id:8, date:'08/30/2026 07:45 AM', title:'Reporter response received (Exhibit A)', actor:'Curtis Jamison'},\n  {id:9, date:'08/28/2026 11:55 AM', title:'Case opened and assigned', actor:'Curtis Jamison'}\n];\n\nconst ACTIVE_BTN = \"font-family:Barlow;font-size:14px;color:#0F56E6;cursor:pointer;\";\nconst DISABLED_BTN = \"font-family:Barlow;font-size:14px;color:#8F9092;cursor:not
